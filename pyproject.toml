[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cd3_fastdllm"
version = "0.1.0"
description = "Convergence-Driven Diffusion Decoding (CD³) on top of LLaDA/Fast-dLLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["diffusion", "language model", "decoding", "convergence", "LLaDA", "Fast-dLLM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.41",
    "datasets>=2.19",
    "evaluate>=0.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "accelerate>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
# code_eval metric requires the sandbox; install separately
code_eval = [
    "evaluate[evaluator]>=0.4",
]

[project.urls]
Homepage = "https://github.com/DrsikaGupta/cd3-fastdllm"
Issues = "https://github.com/DrsikaGupta/cd3-fastdllm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cd3_fastdllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
